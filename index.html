<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Soberbia Nails — Servicio profesional de uñas, manicura, pedicura y diseño artístico.">
  <title>Soberbia Nails</title>

  <!-- Google Fonts: Poppins con varios pesos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos globales (variables CSS mapeadas desde stylesCnfg.json) -->
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/x-icon" href="img/ui/nail.png">

  <!-- Contenido de previsualizaciopn enlaces -->
    <meta name="author" content="Soberbia Nails">
    <meta name="description" content="Servicio profesional de uñas en un ambiente relajante">
    <meta name="keywords" content="uñas, manicura, pedicura, manos, pies">

    <meta property="og:title" content="Soberbia Nails" />
    <meta property="og:site_name" content="Soberbia Nails" />
    <meta property="og:description" content="Servicio profesional de uñas en un ambiente relajante" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dvncml.github.io/S-Nails/" />
    <meta property="og:image" content="https://dvncml.github.io/S-Nails/img/ui/Local.jpg" /> 

</head>
<body>

  <!-- ============================================
       PANTALLA DE CARGA
       Se muestra hasta que app.js cargue los JSON
       ============================================ -->
  <div id="loading-screen">
    <div class="loader-spinner"></div>
    <p class="loader-text">Cargando...</p>
  </div>

  <!-- ============================================
       PANTALLA DE ERROR (oculta por defecto)
       Se muestra si falla la carga de datos
       ============================================ -->
  <div id="error-screen">
    <p id="error-message">Hubo un problema al cargar el sitio.</p>
    <button class="btn btn-primary" onclick="location.reload()">Reintentar</button>
  </div>

  <!-- ============================================
       TOGGLE MODO OSCURO
       app.js inserta el ícono (sol/luna)
       ============================================ -->
  <button id="dark-toggle" aria-label="Cambiar modo oscuro"></button>

  <!-- ============================================
       MENÚ FLOTANTE DE CONTACTO
       app.js renderiza:
       - .menu-fab (burbuja, móvil)
       - .menu-options (panel con botones)
       ============================================ -->
  <nav id="menu-contacto" aria-label="Contacto rápido"></nav>

  <!-- ============================================
       CONTENIDO PRINCIPAL
       app.js renderiza cada sección aquí
       ============================================ -->
  <main id="app"></main>

  <!-- ============================================
       FOOTER
       app.js renderiza el contenido
       ============================================ -->
  <footer id="site-footer"></footer>

  <!-- ============================================
       MODAL (overlay + contenedor vacío)
       app.js llena el contenido dinámicamente
       ============================================ -->
  <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div id="modal-container" class="modal-container"></div>
  </div>

  <!-- Lógica de la aplicación -->
  <script src="app.js"></script>
</body>
</html>
